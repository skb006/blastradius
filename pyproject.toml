[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
version = "0.1.0"
description = "Prove what an AI agent can actually reach."
requires-python = ">=3.11"
# Zero runtime dependencies is a deliberate security property, not an
# accident: this tool reads live credentials, so it ships no supply chain
# of its own. Do not add a runtime dependency without an explicit decision.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blastradius = "blastradius.cli:main"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
